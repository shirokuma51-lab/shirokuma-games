ion:absolute;border:0;background:transparent;padding:4px;color:#625f50;font-size:21px}#card{width:100%;height:auto} #pad{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(2,34px);width:100px;height:76px;border:0;background:transparent;gap:2px}#pad button{padding:0;font-size:22px;touch-action:none;background:#fff3d9e8}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1;grid-row:2}#pad button:nth-child(3){grid-column:2;grid-row:2}#pad button:nth-child(4){grid-column:3;grid-row:2}</style><main><canvas id="world" aria-label="むぎの丘の農場"></canvas><header><div><strong>むぎの丘だより</strong><span id="date"></span></div><div id="stats"></div><button id="menu">手帳</button></header><button id="interact" hidden style="position:absolute;bottom:154px;right:14px;background:#ffedb7">調べる</button><div id="hint" role="status">村の地図を読み込み中…</div><footer><div id="pad" aria-label="移動"><button data-move="ArrowUp" aria-label="前へ">↑</button><button data-move="ArrowLeft" aria-label="左へ">←</button><button data-move="ArrowDown" aria-label="後ろへ">↓</button><button data-move="ArrowRight" aria-label="右へ">→</button></div><button id="tools">道具切替</button><button id="swing">種まき</button></footer><dialog><small>MUGI NO OKA ・ 農場手帳</small><h2></h2><p id="body"></p><div id="extra"></div><div id="choices"></div></dialog></main><script src="../forgetful-3d/three.bundle.js"></script><script src="farm.js?v=5"></script><script src="art.js?v=5"></script><script src="village.js?v=5"></script><script src="display.js?v=5"></script><script src="view.js?v=5"></script></html>
